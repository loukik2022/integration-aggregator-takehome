apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth2-server
  labels:
    app: mock-oauth2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oauth2-server
  template:
    metadata:
      labels:
        app: mock-oauth2-server
    spec:
      containers:
        - name: mock-oauth2-server
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_HOSTNAME
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG
              value: '{"interactiveLogin": false}'
          readinessProbe:
            httpGet:
              path: /isalive
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /isalive
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth2-server
  labels:
    app: mock-oauth2-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: mock-oauth2-server
