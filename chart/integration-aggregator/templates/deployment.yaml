apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "integration-aggregator.fullname" . }}
  labels:
    {{- include "integration-aggregator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "integration-aggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "integration-aggregator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "integration-aggregator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.address | quote }}
            - name: OPENBAO_MOUNT_PATH
              value: {{ .Values.openbao.mountPath | quote }}
            - name: OPENBAO_TIMEOUT
              value: {{ .Values.openbao.timeout | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.app.workerConcurrency | quote }}
            - name: STATE_TTL_SECONDS
              value: {{ .Values.app.stateTtlSeconds | quote }}
            - name: REQUEST_TTL_SECONDS
              value: {{ .Values.app.requestTtlSeconds | quote }}
            - name: OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.tokenSecret }}
                  key: {{ .Values.openbao.tokenKey }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
